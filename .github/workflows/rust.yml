name: Rust

# CI for the Build Log Library (IP-01 phases 1G, 1H and 1I).
#
#   Test            the required check (decision D01-5): passes only if every job below it succeeded. It is the only job called `Test`.
#   Lint            fmt and clippy.
#   Test (<leg>)    the test suite on ubuntu-24.04, windows-latest and in Debian bookworm (the image tauri's container is built on, libhdf5 1.10.8),
#                   and an ADVISORY leg on ubuntu-26.04 (it cannot fail the required check; see the matrix).
#                   Each leg reports and checks the libhdf5 it linked (phase 1I).
#   Feature matrix  the facade builds with each feature combination of BL-AR-07.
#   Commit messages commitlint over the commits of the change.
#   WebAssembly check (advisory) and Static libhdf5 (advisory) are not part of the required check: they show on the pull request but never block it.
#   Release         after `Test`, on a push to `main` or `release` only (IP-26 phase 26I): a candidate or a stable version. A manual run is a dry run.
#
# RUNNERS: every Ubuntu job is pinned to ubuntu-24.04, not ubuntu-latest, while GitHub moves ubuntu-latest to 26.04 (rollout 2026-10-19 to 2026-11-19: jobs
# land on either image meanwhile, which made runs fail on 2026-11-11 when the 26.04 runners could not resolve the Ubuntu mirrors). A release must never
# depend on a floating image either. Move to ubuntu-26.04 explicitly, in one edit per job, when the advisory 26.04 leg of Test is green.
#
# HDF5: Linux installs libhdf5-dev with apt (each such step is limited to 5 minutes: on 2026-11-11 the Ubuntu runners could not resolve the Ubuntu mirrors
# and apt kept retrying for over half an hour, so a stall now fails the job in minutes); Windows installs hdf5 with vcpkg. Only vcpkg's *archives* are cached, never `installed/`: a cached
# `installed/` went stale when the runner's compiler changed (Machine_Config_Library, 2026-08). A failure that looks like "Unable to locate HDF5 root
# directory and/or headers" (the binding's build script) or "Could NOT find HDF5" (CMake) after a runner image update means vcpkg's archive folder or
# the HDF5_DIR step needs another look.

on:
  workflow_dispatch:
    inputs:
      simulate:
        description: "Prove the required check: make one job fail or be skipped. Leave as none for a real run."
        type: choice
        options: [none, fail-lint, skip-lint]
        default: none
  push:
    # `release` is where stable versions are made (docs/release-process.md). A tag push is not a trigger: the release job's own tags never start a run.
    branches: ["main", "release"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The candidate minimum libhdf5 for BL-ST-01: the oldest version a tauri deployment uses (its container has 1.10.8). IP-03 declares the real one.
  # Every test leg fails if the libhdf5 it links is older.
  LIBHDF5_MINIMUM: "1.10.8"

jobs:
  lint:
    name: Lint
    if: ${{ inputs.simulate != 'skip-lint' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Forced failure (workflow_dispatch input)
        if: ${{ inputs.simulate == 'fail-lint' }}
        run: |
          echo "::error::forced failure, to prove that the required check fails when a job fails"
          exit 1

      - uses: actions/checkout@v4

      # clippy compiles every crate, and the IO crate's build script needs the HDF5 headers.
      - name: Install libhdf5
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The HDF5 binding's build script reads the installed libhdf5 and is not run again when that changes, so a cached `target/` must not outlive the
      # library it was built against: the key names the library (2026-10-23: a runner with a newer libhdf5 restored a binding built for an older one,
      # and the link failed with `undefined symbol: H5Literate`).
      - name: Work out the libhdf5 cache key
        id: hdf5-key
        shell: bash
        run: echo "key=libhdf5-$(dpkg-query -W -f='${Version}' libhdf5-dev | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.hdf5-key.outputs.key }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The experimental leg below is advisory: if it fails, the job still counts as a success for the required check.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          # Advisory (2026-11-11): GitHub is moving ubuntu-latest to 26.04 between 2026-10-19 and 2026-11-19. This leg shows what 26.04 does to this
          # pipeline without blocking a merge. Move the pinned jobs to ubuntu-26.04, and make this leg required, when it has been green for a while.
          - os: ubuntu-26.04
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Install libhdf5 (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Record how libhdf5 was installed (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p libhdf5-report
          dpkg -l 'libhdf5-*' | awk '/^ii/ {print $2, $3}' > libhdf5-report/install.txt

      - name: Work out the vcpkg cache key (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-key
        shell: pwsh
        run: |
          $hash = (Get-FileHash "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" -Algorithm SHA256).Hash.ToLower()
          "key=vcpkg-archives-x64-windows-$hash" >> $env:GITHUB_OUTPUT

      # vcpkg's binary archives only. `vcpkg install` below runs every time and rebuilds `installed/` from them (about 30 seconds on a hit, several
      # minutes on a miss). A partial hit through restore-keys is still useful when the runner image brings a new vcpkg.
      - name: Cache vcpkg archives (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: ${{ steps.vcpkg-key.outputs.key }}
          restore-keys: vcpkg-archives-x64-windows-

      - name: Install libhdf5 with vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install hdf5:x64-windows

      - name: Point the HDF5 binding at vcpkg's libhdf5 and put its DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          if (-not (Test-Path "$root\include\H5pubconf.h")) { Write-Error "HDF5 headers not found in $root"; exit 1 }
          "HDF5_DIR=$root" >> $env:GITHUB_ENV
          "$root\bin" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH

      - name: Record how libhdf5 was installed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libhdf5-report | Out-Null
          $notes = "libhdf5-report/install.txt"
          $dll = Get-Item "$env:HDF5_DIR\bin\hdf5.dll"
          "vcpkg archives cache, exact hit: ${{ steps.vcpkg-cache.outputs.cache-hit }}" | Set-Content $notes
          "vcpkg package:" | Add-Content $notes
          vcpkg list hdf5 | Add-Content $notes
          "hdf5.dll file version: $($dll.VersionInfo.FileVersion)" | Add-Content $notes
          "hdf5.dll: $($dll.FullName)" | Add-Content $notes

      - uses: dtolnay/rust-toolchain@stable

      # The binding's build script is not run again when the installed libhdf5 changes, so the cache key names the library (see the Lint job).
      - name: Work out the libhdf5 cache key (Linux)
        if: runner.os == 'Linux'
        id: hdf5-key-linux
        shell: bash
        run: echo "key=libhdf5-$(dpkg-query -W -f='${Version}' libhdf5-dev | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - name: Work out the libhdf5 cache key (Windows)
        if: runner.os == 'Windows'
        id: hdf5-key-windows
        shell: pwsh
        run: |
          $version = (Get-Item "$env:HDF5_DIR\bin\hdf5.dll").VersionInfo.FileVersion -replace '[^0-9A-Za-z._-]', '-'
          "key=libhdf5-$version" >> $env:GITHUB_OUTPUT

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.hdf5-key-linux.outputs.key }}${{ steps.hdf5-key-windows.outputs.key }}

      - name: Report the libhdf5 version
        shell: bash
        run: bash .github/scripts/report-libhdf5.sh "${{ matrix.os }}"

      - name: Run the tests
        run: cargo test --locked --workspace

      - name: Upload the libhdf5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libhdf5-${{ matrix.os }}
          path: libhdf5-report
          retention-days: 30

  # The image tauri's headless container is built on (clearbox-tauri's Dockerfile: rust:1-bookworm, apt libhdf5-dev, libhdf5 1.10.8). A library tested
  # only on newer libhdf5 versions could pass everywhere else and fail there.
  test-bookworm:
    name: Test (debian-bookworm)
    runs-on: ubuntu-24.04
    container: rust:1-bookworm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install libhdf5
        timeout-minutes: 5
        run: apt-get update && apt-get install -y libhdf5-dev pkg-config

      - name: Record how libhdf5 was installed
        run: |
          mkdir -p libhdf5-report
          dpkg -l 'libhdf5-*' | awk '/^ii/ {print $2, $3}' > libhdf5-report/install.txt

      - name: Work out the libhdf5 cache key
        id: hdf5-key
        shell: bash
        run: echo "key=libhdf5-$(dpkg-query -W -f='${Version}' libhdf5-dev | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.hdf5-key.outputs.key }}

      - name: Report the libhdf5 version (it must be exactly the version tauri's container has)
        shell: bash
        run: bash .github/scripts/report-libhdf5.sh debian-bookworm --exactly 1.10.8

      - name: Run the tests
        run: cargo test --locked --workspace

      - name: Upload the libhdf5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libhdf5-debian-bookworm
          path: libhdf5-report
          retention-days: 30

  features:
    name: Feature matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install libhdf5
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Work out the libhdf5 cache key
        id: hdf5-key
        shell: bash
        run: echo "key=libhdf5-$(dpkg-query -W -f='${Version}' libhdf5-dev | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.hdf5-key.outputs.key }}

      - name: Build every feature combination
        run: cargo test --locked -p build-log --test feature_matrix

  commitlint:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22: the tooling now includes semantic-release, which needs 22.14 or later (the release job below uses the same).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: the `prepare` script would install the husky hooks, which a CI run must not do.
      - name: Install the commit-lint tooling
        run: npm ci --ignore-scripts

      - name: Lint the commits of this change
        env:
          HUSKY: "0"
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            npx --no-install commitlint --last --verbose
          else
            npx --no-install commitlint --from "$BASE" --to "$HEAD" --verbose
          fi

  # Not part of the required check: shown on the pull request, never blocking. It answers spike S7: the Model must stay free of anything that cannot
  # compile for the web, which is the only web work kept (decision D01-12).
  wasm:
    name: WebAssembly check (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check that the Model builds for wasm32
        run: cargo check --locked --target wasm32-unknown-unknown -p build-log-model

  # Not part of the required check: compiling libhdf5 from source is slow. It proves the no-system-libhdf5 path that a developer machine without libhdf5
  # uses. It becomes required if it proves fast and stable once cached.
  static-hdf5:
    name: Static libhdf5 (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the IO crate with libhdf5 compiled from source
        run: cargo test --locked -p build-log-io --features static-hdf5

  # The required check (decision D01-5). A matrix renames its jobs, so the name the ruleset requires lives here, on one job that depends on all the
  # gating ones. It runs even when they fail, and a job that was skipped or cancelled counts as a failure: a skipped job tested nothing.
  required-check:
    name: Test
    needs: [lint, test, test-bookworm, features, commitlint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job this check depends on succeeded
        env:
          RESULTS: >-
            lint=${{ needs.lint.result }}
            test=${{ needs.test.result }}
            test-bookworm=${{ needs.test-bookworm.result }}
            features=${{ needs.features.result }}
            commitlint=${{ needs.commitlint.result }}
        run: |
          bad=0
          if [ -z "$RESULTS" ]; then bad=1; fi
          {
            echo "### Required check"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in $RESULTS; do
            job="${pair%%=*}"
            result="${pair#*=}"
            echo "$job: $result"
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then bad=1; fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::a job that gates the merge did not succeed (a skipped or cancelled job counts as a failure)"
            exit 1
          fi

  # Release automation (IP-26 phase 26I, decisions D26-4 and D26-13; docs/release-process.md). A push to `main` makes a release candidate (v0.y.z-rc.N, a
  # GitHub pre-release) and a push to `release` makes a stable version, each ONLY when the required check above succeeded (a job whose `needs` failed or
  # was skipped does not run) and only when a commit since the last release says so: feat, fix, perf, refactor, revert, or a breaking change. docs, ci,
  # test, build, style and chore release nothing. The job commits the new version to Cargo.toml and Cargo.lock ("chore(release): ... [skip ci]", which
  # starts no run), tags it and creates the GitHub release; it pushes with a deploy key because the rulesets on `main` and `release` take pull requests only.
  #
  # A MANUAL run (workflow_dispatch) is always a DRY RUN: it prints the version that would be released and creates nothing. It is how the configuration
  # and the deploy key are proved, and with `simulate` set it shows that a failed required check stops the release.
  release:
    name: Release
    needs: [required-check]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the GitHub release (the version commit and the tag go with the deploy key)
    # One release at a time across both branches: a candidate and a stable version must not push together, and a run is never cancelled half way.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release reads the whole history and every tag
          persist-credentials: false # the push uses the deploy key, never this job's token

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: the `prepare` script would install the husky hooks, which a release job must not do.
      - name: Install the release tooling
        run: npm ci --ignore-scripts

      - name: Configure the deploy key for git push
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: bash .github/scripts/configure-deploy-key-git.sh

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          flags=""
          if [ "$EVENT" = "workflow_dispatch" ]; then flags="--dry-run"; fi
          npx --no-install semantic-release --repository-url "${SEMANTIC_RELEASE_REPOSITORY_URL}" $flags

      # After a stable version only (Q26-7): the stable tag has to be in the history of `main`, or the next candidate would be numbered from the old version.
      - name: Merge release back into main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release' && steps.release.outputs.version != '' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/scripts/back-merge.sh "$VERSION"
