[package]
name = "build-log-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Conformance assertions for the Build Log Library: what the Common Data Model must show for each committed miniature, checked against the independent expectation files. Dev-only."

[dependencies]
build-log-model = { workspace = true }
# reads the expectation files of testdata/expectations. `float_roundtrip` makes a number parse to the nearest `f64` of its text: without it a value such as
# 0.029999999329447746 comes out one unit in the last place lower, and an adapter that reads the same number exactly would be reported as wrong (found by IP-13 phase 13B)
serde_json = { version = "1", features = ["float_roundtrip"] }
# fingerprints the columns that a source serves (IP-06 phase 6A): the SHA-256 of their little-endian bytes. Already in the lockfile, for the test kit's checksum test
sha2 = "0.10"

[lints]
workspace = true
