[package]
name = "build-log-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The IO layer of the Build Log Library: HDF5 files to and from the Model. The HDF5 binding is here; the adapters arrive with IP-04 and after."

[features]
# Compile libhdf5 from source and link it in, instead of using the library installed on the machine (the local default on a machine without HDF5).
# It needs CMake and a C compiler, takes a few minutes the first time, and leaves its result in `target/`. `zlib` is there because tauri's files are gzip-compressed.
static-hdf5 = ["hdf5/static", "hdf5/zlib"]

[dependencies]
build-log-model = { workspace = true }
hdf5 = { workspace = true }

[dev-dependencies]
build-log-testkit = { workspace = true }
# holds each adapter's output to the expectation files (IP-13): allowed by the architecture rules as a dev dependency
build-log-conformance = { workspace = true }
# reads `testdata/primitives.json`, the oracle of the primitives' tests
serde_json = "1"

[lints]
workspace = true
